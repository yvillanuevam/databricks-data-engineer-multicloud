bundle:
  name: retail-pedidos-yvillanuevam

variables:
  catalogo:
    description: Catálogo de Unity Catalog con permiso CREATE SCHEMA
    default: "workspace"

targets:
  curso:
    default: true

resources:
  jobs:
    retail_pedidos:
      name: "Proyecto final | Retail pedidos | yvillanuevam"
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Lima
        pause_status: UNPAUSED
      parameters:
        - name: catalogo
          default: ${var.catalogo}
        - name: fecha_corte
          default: ""
      tasks:
        - task_key: raw
          notebook_task:
            notebook_path: ./notebooks/01_raw.py
        - task_key: bronze
          depends_on:
            - task_key: raw
          notebook_task:
            notebook_path: ./notebooks/02_bronze.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/03_silver.py
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/04_gold.py
        - task_key: calidad
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ./notebooks/05_calidad.py
        - task_key: mantenimiento
          depends_on:
            - task_key: calidad
          notebook_task:
            notebook_path: ./notebooks/06_mantenimiento.py
